name: Deploy application to AWS (dev)

# Manual by default. Set repository variable AUTO_DEPLOY=true after the first successful release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "infrastructure/scripts/build_lambda.py"
      - ".github/workflows/deploy-aws-dev.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-development-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: aws-dev
    timeout-minutes: 45

    env:
      AWS_REGION: ap-southeast-2
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_FRONTEND_BUCKET: ${{ vars.AWS_FRONTEND_BUCKET }}
      AWS_ARTIFACT_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
      AWS_CLOUDFRONT_ID: ${{ vars.AWS_CLOUDFRONT_ID }}
      AWS_API_URL: ${{ vars.AWS_API_URL }}
      AWS_COGNITO_POOL_ID: ${{ vars.AWS_COGNITO_POOL_ID }}
      AWS_COGNITO_CLIENT_ID: ${{ vars.AWS_COGNITO_CLIENT_ID }}
      AWS_API_FUNCTION: ${{ vars.AWS_API_FUNCTION }}
      AWS_WORKER_FUNCTION: ${{ vars.AWS_WORKER_FUNCTION }}

    steps:
      - name: Check out approved source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify required deployment settings
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_DEPLOY_ROLE_ARN AWS_FRONTEND_BUCKET AWS_ARTIFACT_BUCKET AWS_CLOUDFRONT_ID AWS_API_URL AWS_COGNITO_POOL_ID AWS_COGNITO_CLIENT_ID AWS_API_FUNCTION AWS_WORKER_FUNCTION; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub repository variable: $name"
              exit 1
            fi
          done
          if [[ "$AWS_API_URL" != https://* ]]; then
            echo "::error::AWS_API_URL must use HTTPS"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backend tests
        env:
          APP_ENV: local
          ALLOW_DEV_AUTH: "true"
          DATABASE_URL: sqlite:///./ci.db
          PYTHONPATH: backend
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pytest backend/tests -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build production website
        env:
          VITE_API_URL: ${{ vars.AWS_API_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.AWS_COGNITO_POOL_ID }}
          VITE_COGNITO_APP_CLIENT_ID: ${{ vars.AWS_COGNITO_CLIENT_ID }}
          VITE_DEMO_MODE: "false"
        run: |
          npm install --prefix frontend
          npm run build --prefix frontend

      - name: Package backend for AWS Lambda
        run: python infrastructure/scripts/build_lambda.py

      - name: Obtain temporary AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
          role-session-name: insurance-dev-${{ github.run_id }}

      - name: Verify AWS account
        run: aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output json

      - name: Deploy API and document-processing Lambdas
        shell: bash
        run: |
          set -euo pipefail
          KEY="lambda/insurance-lambda-${GITHUB_SHA}.zip"
          aws s3 cp build/insurance-lambda.zip "s3://${AWS_ARTIFACT_BUCKET}/${KEY}" --sse AES256
          aws lambda update-function-code \
            --function-name "$AWS_API_FUNCTION" \
            --s3-bucket "$AWS_ARTIFACT_BUCKET" \
            --s3-key "$KEY" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$AWS_API_FUNCTION"
          aws lambda update-function-code \
            --function-name "$AWS_WORKER_FUNCTION" \
            --s3-bucket "$AWS_ARTIFACT_BUCKET" \
            --s3-key "$KEY" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$AWS_WORKER_FUNCTION"
          echo "Deployed Lambda code from $GITHUB_SHA"

      - name: Publish React to private S3
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync frontend/dist "s3://${AWS_FRONTEND_BUCKET}/" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$AWS_CLOUDFRONT_ID" --paths "/*"

      - name: Verify deployed API health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "${AWS_API_URL%/}/health"
